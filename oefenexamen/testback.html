<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap demo</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body>
  <main class="container">
    <h1>Weerbericht</h1>
    <div class="input-group mb-3 mt-2">
      <input type="search" class="form-control" placeholder="Postcode zoeken..." id="postcode">
      <button class="btn btn-outline-secondary" type="button" id="button">zoeken</button>
    </div>
    <div id="resultaat"></div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"></script>

  <script>
    const inputPostcode = document.getElementById('postcode')
    const button = document.getElementById('button')
    const resultContainer = document.querySelector("#resultaat")

    button.addEventListener('click', searchPostcode)

    function searchPostcode() {
      const postcode = Number(inputPostcode.value.trim())
      resultContainer.innerHTML = ''
      if (Number.isNaN(postcode) || postcode < 1000 || postcode > 9999) {
        resultContainer.innerHTML = ''
        const errorNumber = document.createElement('div')
        errorNumber.className = 'alert alert-danger'
        errorNumber.role = 'alert'
        errorNumber.textContent = 'u hebt geen Belgische postcode in gegeven'
        resultContainer.appendChild(errorNumber)
      } else {
        getCoordinates(postcode)
      }
    }

    async function getCoordinates(postcode) {
      let lat
      let lon
      let name

      try {
        const geoResponse = await fetch(
          `https://api.openweathermap.org/geo/1.0/zip?zip=${postcode},BE&appid=4411849b0d5f7de129e950e5af5d8b75`
        )

        if (geoResponse.status === 404) {
          showError(`We konden de postcode ${postcode} niet vinden in België.`)
          return
        }

        if (!geoResponse.ok) {
          showError(`Postcode opzoeken mislukt (status ${geoResponse.status}).`)
          return
        }

        const geoData = await geoResponse.json()
        lat = geoData.lat
        lon = geoData.lon
        name = geoData.name
      } catch (error) {
        showError('Netwerkfout bij het opzoeken van de postcode. Probeer opnieuw.')
        return
      }
      getWeather(lat, lon, name)
    }

    function showError(message) {
      resultContainer.innerHTML = ''
      const errorData = document.createElement('div')
      errorData.className = 'alert alert-danger'
      errorData.role = 'alert'
      errorData.textContent = message
      resultContainer.appendChild(errorData)
    }



    async function getWeather(lat, lon, name) {
      try {
        const wheatherResponse = await fetch(`https://api.openweathermap.org/data/2.5/weather?lat=${lat}&lon=${lon}&units=metric&lang=nl&appid=4411849b0d5f7de129e950e5af5d8b75`)
        if (wheatherResponse.status === 404) {
          showError(`We konden het weer van ${name} niet ophalen.`)
          return
        }

        if (!wheatherResponse.ok) {
          showError(`Postcode opzoeken mislukt (status ${wheatherResponse.status}).`)
          return
        }

        const wheatherData = await wheatherResponse.json()
        console.log(wheatherData)

      } catch (error) {
        showError('Netwerkfout bij het opzoeken van het weerbericht. Probeer opnieuw.')
        return
      }

    }

  </script>
</body>

</html>
