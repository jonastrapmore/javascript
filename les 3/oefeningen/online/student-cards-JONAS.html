<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">

    <style>
        #students {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
        }
    </style>
</head>

<body>
    <main class="container">
        <h1>Student Cards</h1>
        <button class="btn btn-primary mt-2 start-app">start app</button>
        <div id="students"></div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script>
        const students = [
            { name: 'alica', age: 19, afstudeerrichting: 'Wiskune' },
            { name: 'Bart', age: 23, afstudeerrichting: 'Boekhouden' },
            { name: 'Hannelore', age: 18, afstudeerrichting: 'IT' },
        ]

        const studentsContainer = document.querySelector('#students')
        const startButton = document.querySelector('.start-app')

        //OPTIE1
        /*
        startButton.addEventListener('click', () =>{
            showStudent
        })

        //OPTIE2
        startButton.addEventListener('click', function(){
            showStudent()
        })*/

        //optie3
        startButton.addEventListener('click', showStudent)


        //OPTIE 1
        //studentsContainer.innerHTML += `<div class="card"><p>${student.name}</p></div>`

        //OPTIE2
        function showStudent() {
            students.forEach(student => {
                const card = document.createElement('div')
                card.className = 'card m-2'
                card.style.width = '18rem'

                const cardBody = document.createElement('div')
                cardBody.className = 'card-body'

                const cardTitle = document.createElement('h5')
                cardTitle.className = 'card-title'
                cardTitle.textContent = student.name

                const cardText = document.createElement('p')
                cardText.className = 'card-text'
                cardText.textContent = `Leeftijd: ${student.age}, Afstudeerrichting: ${student.afstudeerrichting}`

                cardBody.appendChild(cardTitle)
                cardBody.appendChild(cardText)
                card.appendChild(cardBody)
                studentsContainer.appendChild(card)
            })
            startButton.hidden = true
            }
    </script>
</body>

</html>
